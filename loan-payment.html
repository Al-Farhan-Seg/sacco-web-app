    <div class="loan-container">
      <h2>LOAN PAYMENT FORM</h2>
      <form action="">
        <label for="payment-id">Payment ID:</label>
        <input type="text" name="payment_id" id="payment-id" min="1" required>

        <label for="loan-id">Loan ID:</label>
        <input type="text" name="loan_id" id="loan-id" min="1" required>

        <label for="amount">Amount:</label>
        <input type="number" name="amount" id="amount" min="1" required>

        <label for="payment-date">Date:</label>
        <input type="date" name="date" id="payment-date" required>

        <input type="submit" value="Submit" id="submit-btn">
      </form>
