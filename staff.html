<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Staff Management" />
    <title>Staff | SACCO Management System</title>
    <link rel="stylesheet" href="css/staff.css" />
  </head>
  <body>
    <header>
      <h1>Staff Registration</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="./account.html">Account</a>
        <a href="./member.html">Member</a>
        <a href="./saving.html">Saving</a>
        <a href="./staff.html">Staff</a>
        <a href="./withdrawal.html">Withdrawal</a>
        <a href="./loan-payment.html">Loan Payment</a>
        <a href="./loan.html">Loan</a>
        <a href="./login.html">Login</a>
      </nav>
    </header>

    <main>
      <div>
        <h2>Staff Details</h2>
        <form action="">
          <label for="staff-id">Staff Id</label>
          <input
            id="staff-id"
            name="staff_id"
            placeholder="e.g STFoo1"
            required
          />
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" required />
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" required />
          <label for="gender">Gender</label>
          <select name="gender" id="gender" required>
            <option value="">Select gender</option>
            <option>female</option>
            <option>male</option>
          </select>
          <label for="position">Position</label>
          <input type="text" id="position" name="position" required />
          <button type="submit">Register</button>
        </form>
      </div>
    </main>

    <script src="staff.js"></script>
  </body>
</html>
