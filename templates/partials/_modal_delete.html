<div class="modal-head">
  <h2 id="modal-title">Delete this record?</h2>
  <button type="button" class="icon-btn" data-modal-close aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button>
</div>
<form method="post" action="{{ request.path }}">
  {% csrf_token %}
  <div class="modal-body">
    <p class="modal-text"><strong>{{ object }}</strong> will be deleted.{% if delete_note %} {{ delete_note }}{% endif %}</p>
    <p class="modal-text modal-warning">This cannot be undone.</p>
  </div>
  <div class="modal-foot">
    <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
    <button type="submit" class="btn btn-danger"><i data-lucide="trash-2" aria-hidden="true"></i>Delete</button>
  </div>
</form>
