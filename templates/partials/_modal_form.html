<div class="modal-head">
  <h2 id="modal-title">{{ modal_title }}</h2>
  <button type="button" class="icon-btn" data-modal-close aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button>
</div>
<form method="post" action="{{ request.path }}">
  {% csrf_token %}
  <div class="modal-body">
    {% if form.non_field_errors %}
      <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
    <div class="form-grid">
      {% for field in form.visible_fields %}
        <div class="field{% if field.errors %} has-error{% endif %}">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</p>{% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
  <div class="modal-foot">
    <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
