    <div class="withdrawal-container">
      <h2>Withdrawal Form</h2>
      <form action="">
        <label for="withdraw-id">Withdraw ID:</label>
        <input type="number" name="withdraw_id" id="withdraw-id" min="1" required>

        <label for="account-id">Account ID:</label>
        <input type="number" name="account_id" id="account-id" min="1" required>

        <label for="member-id">Member ID:</label>
        <input type="number" name="member_id" id="member-id" min="1" required>

        <label for="amount">Amount:</label>
        <input type="number" name="amount" id="amount" min="1" required>

        <label for="withdraw-date">Date:</label>
        <input type="date" name="date" id="withdraw-date" required>

        <input type="submit" value="Submit" id="submit-btn">
      </form>
